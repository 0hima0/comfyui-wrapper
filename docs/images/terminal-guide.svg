<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">アプリのフォルダーでGit Bashを開く</title><desc id="desc">README.mdとrequirements.txtがあるフォルダーの余白を右クリックし、Git Bash Hereを選んで、端末でファイル名を確認する説明図。</desc><rect width="1000" height="330" rx="14" fill="#f0f5f3"/><g font-family="sans-serif" fill="#173a35"><text x="24" y="36" font-size="19" font-weight="bold">Windowsの操作例（説明図）</text><rect x="24" y="62" width="300" height="226" rx="10" fill="white" stroke="#a8c5bc"/><text x="40" y="91" font-size="16" font-weight="bold">① llmpc-image-kit を開く</text><text x="44" y="130" font-size="16">README.md</text><text x="44" y="161" font-size="16">requirements.txt</text><rect x="40" y="184" width="267" height="82" rx="8" fill="#e3f1ea"/><text x="54" y="218" font-size="15">フォルダー内の余白で</text><text x="54" y="245" font-size="15">右クリック</text><text x="337" y="180" font-size="26">→</text><rect x="378" y="62" width="250" height="226" rx="10" fill="white" stroke="#a8c5bc"/><text x="394" y="91" font-size="16" font-weight="bold">② メニューから選択</text><rect x="392" y="116" width="222" height="54" rx="7" fill="#126659"/><text x="408" y="148" font-size="17" fill="white">Git Bash Here</text><text x="394" y="207" font-size="13">見当たらない場合は</text><text x="394" y="231" font-size="13">「その他のオプション」も確認</text><text x="394" y="261" font-size="12">表示名はOS・Gitの版で異なります</text><text x="641" y="180" font-size="26">→</text><rect x="680" y="62" width="296" height="226" rx="10" fill="#203c37"/><text x="696" y="91" font-size="16" font-weight="bold" fill="white">③ 開いた端末で確認</text><text x="696" y="132" font-size="13" fill="#c7f1dd">ls README.md requirements.txt</text><text x="696" y="184" font-size="13" fill="white">README.md</text><text x="696" y="208" font-size="13" fill="white">requirements.txt</text><text x="696" y="256" font-size="13" fill="#c7f1dd">2つの名前が出れば次へ</text></g></svg>